<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Astrobiologia</title>
  <meta name="description" content="Um espaço de divulgação científica sobre astrobiologia, microrganismos, ambientes extremos e vida no universo.">

  <link rel="stylesheet" href="assets/css/redesign.css?v=501">
  <link rel="stylesheet" href="assets/css/redesign-solar.css?v=507">
  <link rel="stylesheet" href="assets/css/redesign-navigation.css?v=506">
  <link rel="stylesheet" href="assets/css/redesign-posts.css?v=48">
  <link rel="stylesheet" href="assets/css/fonts-override.css?v=6">
</head>

<body class="redesign-home">
  <canvas id="space-background" aria-hidden="true"></canvas>

  <nav class="astro-side-nav" aria-label="Navegação principal">
    <button
      class="astro-side-nav__trigger"
      data-astro-menu-trigger
      type="button"
      aria-label="Abrir menu"
      aria-expanded="false"
      aria-controls="astro-side-nav-panel"
    >
      <span class="astro-side-nav__trigger-icon" aria-hidden="true"></span>
      <span class="astro-side-nav__trigger-label" aria-hidden="true">Navigation</span>
    </button>

    <div class="astro-side-nav__overlay" data-astro-menu-overlay aria-hidden="true"></div>

    <aside id="astro-side-nav-panel" class="astro-side-nav__panel" aria-hidden="true">
      <button class="astro-side-nav__close" data-astro-menu-close type="button" aria-label="Fechar menu">
        <span class="astro-side-nav__close-icon" aria-hidden="true"></span>
      </button>

      <div class="astro-side-nav__brand">
        <span class="astro-side-nav__brand-small">Divulgação científica</span>
        <span class="astro-side-nav__brand-title">Astrobiologia</span>
      </div>

      <div class="astro-side-nav__menu">
        <a class="astro-side-nav__link" href="./">Início</a>
        <a class="astro-side-nav__link" href="noticias/">Notícias</a>
        <a class="astro-side-nav__link" href="noticias/">Posts</a>
      </div>
    </aside>
  </nav>

  <main class="redesign-home__main">
    <section class="redesign-solar-hero" aria-label="Sistema solar">
      <div id="redesign-solar-system" class="redesign-solar-system"></div>

      <div class="home-orbit-continuity" aria-hidden="true">
        <svg class="home-orbit-continuity__svg" viewBox="0 0 1600 900" preserveAspectRatio="none">
          <path class="home-orbit-continuity__line home-orbit-continuity__line--1" d="M 0 320 C 260 110 1340 110 1600 320"></path>
          <path class="home-orbit-continuity__line home-orbit-continuity__line--2" d="M 40 355 C 290 170 1310 170 1560 355"></path>
          <path class="home-orbit-continuity__line home-orbit-continuity__line--3" d="M 120 388 C 340 250 1260 250 1480 388"></path>
          <path class="home-orbit-continuity__line home-orbit-continuity__line--4" d="M 200 420 C 370 305 1230 305 1400 420"></path>
        </svg>
      </div>

      <section class="home-posts-gallery" aria-labelledby="home-posts-gallery-title">
        <div class="home-posts-gallery__carousel" data-home-posts-carousel>
          <button
            class="home-posts-gallery__arrow home-posts-gallery__arrow--prev gallery-arrow gallery-arrow--left"
            type="button"
            aria-label="Post anterior"
            data-posts-prev
            hidden
          >
            <i aria-hidden="true"></i>
            <svg aria-hidden="true">
              <use href="#gallery-arrow-circle"></use>
            </svg>
          </button>

          <div class="home-posts-gallery__viewport">
            <div class="home-posts-gallery__track" data-posts-track>
              <p class="home-posts-gallery__loading">Carregando publicações...</p>
            </div>
          </div>

          <button
            class="home-posts-gallery__arrow home-posts-gallery__arrow--next gallery-arrow"
            type="button"
            aria-label="Próximo post"
            data-posts-next
            hidden
          >
            <i aria-hidden="true"></i>
            <svg aria-hidden="true">
              <use href="#gallery-arrow-circle"></use>
            </svg>
          </button>
        </div>
      </section>
    </section>
  </main>

  <svg class="gallery-arrow-symbols" aria-hidden="true" focusable="false">
    <symbol viewBox="0 0 44 44" width="44px" height="44px" id="gallery-arrow-circle" fill="none" stroke="currentColor">
      <circle r="20" cy="22" cx="22"></circle>
    </symbol>
  </svg>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="assets/js/redesign-background.js?v=502"></script>
  <script src="assets/js/redesign-solar.js?v=502"></script>
  <script src="assets/js/redesign-navigation.js?v=504"></script>
  <script src="assets/js/redesign-posts.js?v=12"></script>
</body>
</html>
